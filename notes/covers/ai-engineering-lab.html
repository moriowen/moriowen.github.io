<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=IBM+Plex+Sans:wght@400&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #3a2140; --ink: #f5efe6; --muted: #dccfe0; --dim: #a990ad;
    --orange: #f2a65a; --peach: #f6d3b5; --slate: #6a4d70;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; background: var(--bg); overflow: hidden; }
  body { position: relative; color: var(--ink); }
  .eyebrow { position: absolute; left: 107px; top: 106px; font: 500 22px/1 'IBM Plex Mono', monospace;
    letter-spacing: 0.14em; color: var(--orange); }
  h1 { position: absolute; left: 100px; top: 200px; font: 600 150px/0.95 'Space Grotesk', sans-serif;
    letter-spacing: -0.03em; }
  .sub { position: absolute; left: 107px; top: 540px; font: 400 36px/1.3 'IBM Plex Sans', sans-serif;
    color: var(--muted); }
  .foot { position: absolute; left: 107px; top: 758px; font: 400 27px/1 'IBM Plex Sans', sans-serif;
    color: var(--muted); }
  svg { position: absolute; left: 0; top: 0; }
  .lbl { font: 500 17px 'IBM Plex Mono', monospace; letter-spacing: 0.12em; fill: var(--dim); }
</style>
</head>
<body>
  <div class="eyebrow">PRODUCTION AI SYSTEMS · EXPERIMENTS</div>
  <h1>AI Engineering<br>Lab</h1>
  <div class="sub">How production AI systems are built,<br>evaluated, and scaled</div>
  <div class="foot">25 experiments · 7 domains · one capstone</div>

  <svg id="grid" width="1600" height="900" viewBox="0 0 1600 900"></svg>
  <script>
    // one row per domain, one square per experiment
    const rows = [['RETRIEVAL',5],['OPTIMIZATION',4],['AGENTS',3],['EVALS',4],['SECURITY',2],['MODELS',3],['PRODUCTION',4]];
    const ns = 'http://www.w3.org/2000/svg', svg = document.getElementById('grid');
    const el = (t, a, txt) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); if (txt) e.textContent = txt; svg.appendChild(e); return e; };
    el('text', {class: 'lbl', x: 1000, y: 522}, 'EXPERIMENTS, ONE ROW PER DOMAIN');
    rows.forEach(([name, n], r) => {
      const y = 540 + r * 38;
      el('text', {class: 'lbl', x: 1000, y: y + 21}, name);
      for (let i = 0; i < n; i++) {
        el('rect', {x: 1196 + i * 38, y, width: 28, height: 28, rx: 4, fill: r === 0 ? 'var(--orange)' : 'var(--peach)'});
      }
    });
  </script>
</body>
</html>
