<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=IBM+Plex+Sans:wght@400&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #172238; --ink: #f5efe6; --muted: #c9cfdd; --dim: #8a93a8;
    --orange: #d97a2e; --peach: #f6d3b5; --blue: #6f95d2; --slate: #3a4666; --yellow: #f2c14e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; background: var(--bg); overflow: hidden; }
  body { position: relative; color: var(--ink); }
  .eyebrow { position: absolute; left: 107px; top: 106px; font: 500 22px/1 'IBM Plex Mono', monospace;
    letter-spacing: 0.14em; color: var(--orange); }
  h1 { position: absolute; left: 100px; top: 268px; font: 600 230px/1 'Space Grotesk', sans-serif;
    letter-spacing: -0.03em; }
  .sub { position: absolute; left: 107px; top: 540px; font: 400 36px/1.3 'IBM Plex Sans', sans-serif;
    color: var(--muted); }
  .foot { position: absolute; left: 107px; top: 758px; font: 400 27px/1 'IBM Plex Sans', sans-serif;
    color: var(--muted); }
  svg { position: absolute; left: 0; top: 0; }
  .lbl { font: 500 17px 'IBM Plex Mono', monospace; letter-spacing: 0.12em; fill: var(--dim); }
  .tag { font: 500 22px 'IBM Plex Mono', monospace; text-anchor: middle; dominant-baseline: central; }
</style>
</head>
<body>
  <div class="eyebrow" style="color: var(--yellow)">AI CODING AGENTS · FAILURE PREDICTION</div>
  <h1>Canary</h1>
  <div class="sub">Early failure prediction for AI coding agents</div>
  <div class="foot">SWE-agent · OpenHands · 147k runs</div>

  <svg width="1600" height="900" viewBox="0 0 1600 900">
    <!-- per-turn chance of a fix: one run continues, one is stopped at the threshold -->
    <text class="lbl" x="1000" y="566">P(FIX) EACH TURN</text>
    <line x1="1000" y1="590" x2="1000" y2="810" stroke="var(--slate)" stroke-width="2"/>
    <line x1="1000" y1="810" x2="1464" y2="810" stroke="var(--slate)" stroke-width="2"/>
    <line x1="1000" y1="748" x2="1464" y2="748" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 6"/>
    <text class="lbl" x="1464" y="738" text-anchor="end">STOP THRESHOLD</text>

    <path d="M1004 705 C1070 698, 1110 662, 1180 650 S1320 612, 1452 598" fill="none" stroke="var(--blue)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1452" cy="598" r="7" fill="var(--blue)"/>

    <path d="M1004 712 C1050 720, 1090 700, 1140 722 S1215 742, 1244 748" fill="none" stroke="var(--orange)" stroke-width="4" stroke-linecap="round"/>
    <path d="M1244 748 C1300 762, 1380 784, 1452 796" fill="none" stroke="var(--dim)" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/>
    <g stroke="var(--orange)" stroke-width="4" stroke-linecap="round">
      <line x1="1234" y1="738" x2="1254" y2="758"/><line x1="1254" y1="738" x2="1234" y2="758"/>
    </g>
    <text class="lbl" x="1300" y="836">TURNS SAVED</text>
  </svg>
</body>
</html>
