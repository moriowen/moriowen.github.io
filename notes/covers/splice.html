<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=IBM+Plex+Sans:wght@400&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #172238; --ink: #f5efe6; --muted: #c9cfdd; --dim: #8a93a8;
    --orange: #d97a2e; --peach: #f6d3b5; --blue: #6f95d2; --slate: #3a4666;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; background: var(--bg); overflow: hidden; }
  body { position: relative; color: var(--ink); }
  .eyebrow { position: absolute; left: 107px; top: 106px; font: 500 22px/1 'IBM Plex Mono', monospace;
    letter-spacing: 0.14em; color: var(--orange); }
  h1 { position: absolute; left: 100px; top: 268px; font: 600 230px/1 'Space Grotesk', sans-serif;
    letter-spacing: -0.03em; }
  .sub { position: absolute; left: 107px; top: 540px; font: 400 36px/1.3 'IBM Plex Sans', sans-serif;
    color: var(--muted); }
  .foot { position: absolute; left: 107px; top: 758px; font: 400 27px/1 'IBM Plex Sans', sans-serif;
    color: var(--muted); }
  svg { position: absolute; left: 0; top: 0; }
  .lbl { font: 500 17px 'IBM Plex Mono', monospace; letter-spacing: 0.12em; fill: var(--dim); }
  .tag { font: 500 22px 'IBM Plex Mono', monospace; text-anchor: middle; dominant-baseline: central; }
</style>
</head>
<body>
  <div class="eyebrow">KV CACHE REUSE · LLM SERVING</div>
  <h1>Splice</h1>
  <div class="sub">Non-prefix KV cache reuse for agent memory</div>
  <div class="foot">Mistral-7B · LoCoMo · vLLM</div>

  <svg width="1600" height="900" viewBox="0 0 1600 900">
    <!-- chunks cached alone, then spliced into a new prompt in a different order -->
    <text class="lbl" x="1000" y="566">CACHED ALONE</text>
    <rect x="1000" y="584" width="130" height="48" rx="6" fill="var(--orange)"/>
    <text class="tag" x="1065" y="608" fill="var(--bg)">A</text>
    <rect x="1158" y="584" width="110" height="48" rx="6" fill="var(--peach)"/>
    <text class="tag" x="1213" y="608" fill="var(--bg)">B</text>
    <rect x="1296" y="584" width="150" height="48" rx="6" fill="var(--blue)"/>
    <text class="tag" x="1371" y="608" fill="var(--bg)">C</text>

    <path d="M1371 632 C1371 680, 1163 680, 1163 746" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-dasharray="6 6"/>
    <path d="M1065 632 C1065 680, 1311 680, 1311 746" fill="none" stroke="var(--orange)" stroke-width="2.5" stroke-dasharray="6 6"/>

    <rect x="1000" y="746" width="80" height="48" rx="6" fill="var(--slate)"/>
    <text class="tag" x="1040" y="770" fill="var(--muted)">sys</text>
    <rect x="1088" y="746" width="150" height="48" rx="6" fill="var(--blue)"/>
    <text class="tag" x="1163" y="770" fill="var(--bg)">C</text>
    <rect x="1246" y="746" width="130" height="48" rx="6" fill="var(--orange)"/>
    <text class="tag" x="1311" y="770" fill="var(--bg)">A</text>
    <rect x="1384" y="747.25" width="80" height="45.5" rx="6" fill="none" stroke="var(--ink)" stroke-width="2.5"/>
    <text class="tag" x="1424" y="770" fill="var(--ink)">q</text>
    <text class="lbl" x="1000" y="826">NEW PROMPT</text>
  </svg>
</body>
</html>
