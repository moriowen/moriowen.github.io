<text class="title" x="30" y="70">Jira MCP</text>
<text class="subtitle" x="30" y="89">Ticket requirements</text>
</g>
<g><rect class="node" x="268" y="30" width="210" height="104" rx="9" fill="var(--store)" stroke="var(--store-line)"/>
<text class="type" x="280" y="49">DATA / CONTEXT</text>
<text class="title" x="280" y="70">Shared ADLC repo</text>
<text class="subtitle" x="280" y="89">Service and business-line</text>
