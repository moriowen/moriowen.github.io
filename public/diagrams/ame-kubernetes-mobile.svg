<text class="title" x="228" y="236">Senior engineers</text>
<text class="subtitle" x="228" y="255">Led the migration</text>
</g>
<g><rect class="node" x="18" y="362" width="166" height="112" rx="9" fill="var(--external)" stroke="var(--external-line)"/>
