<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" role="img" aria-labelledby="title desc">
<title id="title">Reusable matching-service architecture</title>
<desc id="desc">Market messages connects to Kafka / WebFlux service; Kafka / WebFlux service connects to Settlement state; External data services connects to Kafka / WebFlux service; Composable functions connects to Kafka / WebFlux service; Business-line behavior connects to Kafka / WebFlux service</desc>
<style>
:root{--bg:#fff;--fg:#172333;--muted:#5d6a7d;--line:#8c9aaf;--grid:#e8edf4;--service:#edf4ff;--service-line:#668fd0;--store:#edf8f5;--store-line:#5a9b8a;--agent:#f3efff;--agent-line:#9280c6;--test:#fff7e9;--test-line:#bf994e;--external:#f5f6f8;--external-line:#a0a9b6}
@media(prefers-color-scheme:dark){:root{--bg:#111214;--fg:#e4e6ea;--muted:#a6b0c2;--line:#76859c;--grid:#252b35;--service:#17253b;--service-line:#6285bd;--store:#142b27;--store-line:#60998a;--agent:#252038;--agent-line:#9989c8;--test:#30281a;--test-line:#b5995f;--external:#1e2229;--external-line:#7b8595}}
.bg{fill:var(--bg)}.grid{fill:none;stroke:var(--grid);stroke-width:.7}.edge{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linejoin:round}.arrow{fill:var(--line)}.node{stroke-width:1.2}.title{font:600 13px system-ui,sans-serif;fill:var(--fg)}.subtitle{font:11px system-ui,sans-serif;fill:var(--muted)}.type{font:9px ui-monospace,monospace;letter-spacing:.7px;fill:var(--muted)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrow" d="M0 0L10 5L0 10Z"/></marker><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path class="grid" d="M20 0H0V20"/></pattern></defs>
<rect class="bg" width="760" height="324"/><rect fill="url(#grid)" width="760" height="324"/>
<path class="edge" d="M228 82.0H268" marker-end="url(#arrow)"/>
<path class="edge" d="M478 82.0H518" marker-end="url(#arrow)"/>
<path class="edge" d="M123.0 190V162.0H248.0V162.0H373.0V134" marker-end="url(#arrow)"/>
<path class="edge" d="M373.0 190V134" marker-end="url(#arrow)"/>
<path class="edge" d="M623.0 190V162.0H498.0V162.0H373.0V134" marker-end="url(#arrow)"/>
<g><rect class="node" x="18" y="30" width="210" height="104" rx="9" fill="var(--external)" stroke="var(--external-line)"/>
<text class="type" x="30" y="49">EXTERNAL</text>
<text class="title" x="30" y="70">Market messages</text>
<text class="subtitle" x="30" y="89">Confirmations and status</text>
<text class="subtitle" x="30" y="103">updates</text>
</g>
<g><rect class="node" x="268" y="30" width="210" height="104" rx="9" fill="var(--service)" stroke="var(--service-line)"/>
<text class="type" x="280" y="49">COMPONENT</text>
<text class="title" x="280" y="70">Kafka / WebFlux service</text>
<text class="subtitle" x="280" y="89">Enrich, transform and match</text>
</g>
<g><rect class="node" x="518" y="30" width="210" height="104" rx="9" fill="var(--service)" stroke="var(--service-line)"/>
<text class="type" x="530" y="49">COMPONENT</text>
<text class="title" x="530" y="70">Settlement state</text>
<text class="subtitle" x="530" y="89">Apply matched trade updates</text>
</g>
<g><rect class="node" x="18" y="190" width="210" height="104" rx="9" fill="var(--external)" stroke="var(--external-line)"/>
<text class="type" x="30" y="209">EXTERNAL</text>
<text class="title" x="30" y="230">External data services</text>
<text class="subtitle" x="30" y="249">Additional matching context</text>
</g>
<g><rect class="node" x="268" y="190" width="210" height="104" rx="9" fill="var(--store)" stroke="var(--store-line)"/>
<text class="type" x="280" y="209">DATA / CONTEXT</text>
<text class="title" x="280" y="230">Composable functions</text>
<text class="subtitle" x="280" y="249">Shared processing across flows</text>
</g>
<g><rect class="node" x="518" y="190" width="210" height="104" rx="9" fill="var(--store)" stroke="var(--store-line)"/>
<text class="type" x="530" y="209">DATA / CONTEXT</text>
<text class="title" x="530" y="230">Business-line behavior</text>
<text class="subtitle" x="530" y="249">Differences within the</text>
<text class="subtitle" x="530" y="263">workflow</text>
</g>
</svg>
