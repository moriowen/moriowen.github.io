<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" role="img" aria-labelledby="title desc">
<title id="title">Fine-tuning experiment architecture</title>
<desc id="desc">TruthfulQA splits connects to Three seeds; Qwen2.5-1.5B connects to Training variants; Training variants connects to Three seeds; Training checks connects to Three seeds; Three seeds connects to Held-out evaluation</desc>
<style>
:root{--bg:#fff;--fg:#172333;--muted:#5d6a7d;--line:#8c9aaf;--grid:#e8edf4;--service:#edf4ff;--service-line:#668fd0;--store:#edf8f5;--store-line:#5a9b8a;--agent:#f3efff;--agent-line:#9280c6;--test:#fff7e9;--test-line:#bf994e;--external:#f5f6f8;--external-line:#a0a9b6}
@media(prefers-color-scheme:dark){:root{--bg:#111214;--fg:#e4e6ea;--muted:#a6b0c2;--line:#76859c;--grid:#252b35;--service:#17253b;--service-line:#6285bd;--store:#142b27;--store-line:#60998a;--agent:#252038;--agent-line:#9989c8;--test:#30281a;--test-line:#b5995f;--external:#1e2229;--external-line:#7b8595}}
.bg{fill:var(--bg)}.grid{fill:none;stroke:var(--grid);stroke-width:.7}.edge{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linejoin:round}.arrow{fill:var(--line)}.node{stroke-width:1.2}.title{font:600 13px system-ui,sans-serif;fill:var(--fg)}.subtitle{font:11px system-ui,sans-serif;fill:var(--muted)}.type{font:9px ui-monospace,monospace;letter-spacing:.7px;fill:var(--muted)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrow" d="M0 0L10 5L0 10Z"/></marker><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path class="grid" d="M20 0H0V20"/></pattern></defs>
<rect class="bg" width="760" height="324"/><rect fill="url(#grid)" width="760" height="324"/>
<path class="edge" d="M123.0 134V162.0H248.0V162.0H373.0V190" marker-end="url(#arrow)"/>
<path class="edge" d="M478 82.0H518" marker-end="url(#arrow)"/>
<path class="edge" d="M623.0 134V162.0H498.0V162.0H373.0V190" marker-end="url(#arrow)"/>
<path class="edge" d="M228 242.0H268" marker-end="url(#arrow)"/>
<path class="edge" d="M478 242.0H518" marker-end="url(#arrow)"/>
<g><rect class="node" x="18" y="30" width="210" height="104" rx="9" fill="var(--store)" stroke="var(--store-line)"/>
<text class="type" x="30" y="49">DATA / CONTEXT</text>
<text class="title" x="30" y="70">TruthfulQA splits</text>
<text class="subtitle" x="30" y="89">Fixed train, validation and</text>
<text class="subtitle" x="30" y="103">test</text>
</g>
<g><rect class="node" x="268" y="30" width="210" height="104" rx="9" fill="var(--agent)" stroke="var(--agent-line)"/>
<text class="type" x="280" y="49">MODEL / AGENT</text>
<text class="title" x="280" y="70">Qwen2.5-1.5B</text>
<text class="subtitle" x="280" y="89">Shared starting model</text>
</g>
<g><rect class="node" x="518" y="30" width="210" height="104" rx="9" fill="var(--service)" stroke="var(--service-line)"/>
<text class="type" x="530" y="49">COMPONENT</text>
<text class="title" x="530" y="70">Training variants</text>
<text class="subtitle" x="530" y="89">LoRA ranks and full</text>
<text class="subtitle" x="530" y="103">fine-tuning</text>
</g>
<g><rect class="node" x="18" y="190" width="210" height="104" rx="9" fill="var(--test)" stroke="var(--test-line)"/>
<text class="type" x="30" y="209">VALIDATION</text>
<text class="title" x="30" y="230">Training checks</text>
<text class="subtitle" x="30" y="249">Non-finite guard and reruns</text>
</g>
<g><rect class="node" x="268" y="190" width="210" height="104" rx="9" fill="var(--service)" stroke="var(--service-line)"/>
<text class="type" x="280" y="209">COMPONENT</text>
<text class="title" x="280" y="230">Three seeds</text>
<text class="subtitle" x="280" y="249">H100 training runs</text>
</g>
<g><rect class="node" x="518" y="190" width="210" height="104" rx="9" fill="var(--test)" stroke="var(--test-line)"/>
<text class="type" x="530" y="209">VALIDATION</text>
<text class="title" x="530" y="230">Held-out evaluation</text>
<text class="subtitle" x="530" y="249">MC1 accuracy and resource use</text>
</g>
</svg>
