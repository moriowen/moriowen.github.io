<g><rect class="node" x="18" y="30" width="210" height="104" rx="9" fill="var(--store)" stroke="var(--store-line)"/>
<text class="type" x="30" y="49">DATA / CONTEXT</text>
<text class="title" x="30" y="70">LongBench questions</text>
<text class="subtitle" x="30" y="89">Same prompts and decoding</text>
</g>
<g><rect class="node" x="268" y="30" width="210" height="104" rx="9" fill="var(--agent)" stroke="var(--agent-line)"/>
<text class="type" x="280" y="49">MODEL / AGENT</text>
<text class="title" x="280" y="70">Llama-3-8B</text>
<text class="subtitle" x="280" y="89">Shared inference model</text>
</g>
<g><rect class="node" x="518" y="30" width="210" height="104" rx="9" fill="var(--service)" stroke="var(--service-line)"/>
<text class="type" x="530" y="49">COMPONENT</text>
<text class="title" x="530" y="70">Four compression methods</text>
<text class="subtitle" x="530" y="89">Calibrated to 16 MiB prompt KV</text>
</g>
<g><rect class="node" x="18" y="190" width="210" height="104" rx="9" fill="var(--store)" stroke="var(--store-line)"/>
<text class="type" x="30" y="209">DATA / CONTEXT</text>
<text class="title" x="30" y="230">Retention logs</text>
<text class="subtitle" x="30" y="249">Positions kept by layer and</text>
<text class="subtitle" x="30" y="263">head</text>
</g>
<g><rect class="node" x="268" y="190" width="210" height="104" rx="9" fill="var(--service)" stroke="var(--service-line)"/>
<text class="type" x="280" y="209">COMPONENT</text>
<text class="title" x="280" y="230">Compressed inference</text>
<text class="subtitle" x="280" y="249">Generate and record answers</text>
</g>
<g><rect class="node" x="518" y="190" width="210" height="104" rx="9" fill="var(--test)" stroke="var(--test-line)"/>
